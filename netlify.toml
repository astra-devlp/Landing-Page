[build]
  command = "npm run build"
  publish = "dist/AstraDev/browser"

# Single-page app: let the Angular router handle every route
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed build files never change: cache them for a year (faster repeat visits).
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
