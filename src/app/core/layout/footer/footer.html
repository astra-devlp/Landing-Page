<footer class="relative w-full border-t border-outline-variant bg-surface">
  <div
    class="mx-auto max-w-[1440px] px-margin-mobile pt-12 pb-28 md:px-margin-tablet lg:px-margin lg:pt-14 lg:pb-10"
  >
    <div class="grid grid-cols-1 gap-10 md:grid-cols-12 md:gap-8">
      <div class="flex flex-col items-start md:col-span-5">
        <a class="mb-4 inline-block" routerLink="/" fragment="inicio">
          <app-brand-logo variant="horizontal" imgClass="h-10 w-auto max-w-[240px]" />
        </a>
        <p class="max-w-sm font-body-sm text-body-sm text-on-surface-variant">
          {{ i18n.copy().footer.blurb }}
        </p>
      </div>

      <nav class="md:col-span-4" [attr.aria-label]="i18n.copy().footer.explore">
        <ul class="grid grid-cols-2 gap-x-6 gap-y-1">
          @for (link of i18n.copy().nav; track link.fragment) {
            <li>
              <a
                class="inline-flex min-h-9 items-center font-body-sm text-body-sm text-on-surface-variant transition-colors hover:text-primary"
                routerLink="/"
                [fragment]="link.fragment"
              >
                {{ link.label }}
              </a>
            </li>
          }
        </ul>
      </nav>

      <div class="flex flex-col items-start gap-1 md:col-span-3">
        <a
          class="inline-flex min-h-9 items-center gap-2 font-body-sm text-body-sm text-on-surface-variant transition-colors hover:text-primary"
          [href]="i18n.copy().whatsapp.href"
          target="_blank"
          rel="noopener noreferrer"
        >
          <app-whatsapp-icon [size]="16" />
          {{ i18n.copy().whatsapp.phone }}
        </a>
        <a
          class="inline-flex min-h-9 items-center gap-2 font-body-sm text-body-sm text-on-surface-variant transition-colors hover:text-primary"
          href="mailto:astra.dev.tech@gmail.com"
        >
          <span class="material-symbols-outlined text-[16px]" aria-hidden="true">mail</span>
          astra.dev.tech&#64;gmail.com
        </a>
      </div>
    </div>

    <p class="mt-10 border-t border-outline-variant pt-6 font-body-sm text-body-sm text-outline">
      © {{ year }} Astra Dev. {{ i18n.copy().footer.rights }}
    </p>
  </div>
</footer>
