<section id="preguntas" class="w-full border-t border-outline-variant py-20 lg:py-28">
  <div class="mx-auto max-w-[1440px] px-margin-mobile md:px-margin-tablet lg:px-margin">
    <div class="grid grid-cols-1 gap-12 lg:grid-cols-12 lg:gap-16">
      <div class="flex flex-col items-start lg:col-span-4">
        <h2 class="section-title mb-6 text-[clamp(2rem,1.4rem+2.4vw,3rem)]">
          {{ i18n.copy().faq.title }}
        </h2>
        <p class="section-lede mb-8">{{ i18n.copy().faq.intro }}</p>
        <div class="flex flex-col items-start gap-1">
          <a
            class="inline-flex min-h-11 items-center gap-2 font-body-md text-body-md font-semibold text-on-surface link-quiet"
            [href]="i18n.copy().faq.href"
            target="_blank"
            rel="noopener noreferrer"
          >
            <app-whatsapp-icon [size]="18" />
            {{ i18n.copy().faq.cta }}
          </a>
          <button
            class="inline-flex min-h-11 items-center gap-2 font-body-md text-body-md font-semibold text-on-surface link-quiet"
            type="button"
            (click)="chat.show()"
          >
            <span class="material-symbols-outlined text-[18px]" aria-hidden="true">smart_toy</span>
            {{ i18n.copy().faq.askAiCta }}
          </button>
        </div>
      </div>

      <div class="lg:col-span-8">
        @for (item of i18n.copy().faq.items; track item.question) {
          <details class="group border-t border-outline-variant last:border-b">
            <summary
              class="flex min-h-14 cursor-pointer list-none items-center justify-between gap-6 py-5 font-display text-[1.125rem] font-semibold text-primary lg:text-[1.25rem] [&::-webkit-details-marker]:hidden"
            >
              {{ item.question }}
              <span
                class="material-symbols-outlined shrink-0 text-[24px] text-on-surface-variant transition duration-200 group-open:rotate-45 group-open:text-accent"
                aria-hidden="true"
                >add</span
              >
            </summary>
            <p class="max-w-[42rem] pb-6 font-body-md text-body-md text-on-surface-variant">
              {{ item.answer }}
            </p>
          </details>
        }
      </div>
    </div>
  </div>
</section>
