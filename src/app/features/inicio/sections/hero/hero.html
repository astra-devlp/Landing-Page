<section id="inicio" class="relative w-full overflow-hidden">
  <div
    class="mx-auto grid max-w-[1440px] grid-cols-1 items-center gap-12 px-margin-mobile pt-10 pb-16 md:px-margin-tablet xl:grid-cols-[minmax(0,1fr)_minmax(0,640px)] xl:gap-16 xl:px-margin xl:pt-14 xl:pb-24"
  >
    <div class="flex flex-col items-start">
      <h1
        class="mb-6 max-w-[16ch] font-display text-[2.6rem] leading-[1.02] font-semibold tracking-[-0.04em] text-primary sm:text-[3.5rem] xl:text-[4.25rem]"
      >
        {{ i18n.copy().hero.title }}
        <span class="text-on-surface-variant">{{ i18n.copy().hero.highlight }}</span>
      </h1>

      <p class="mb-8 max-w-[34rem] font-body-lg text-body-lg text-on-surface-variant">
        {{ i18n.copy().hero.body }}
      </p>

      <div class="mb-8 flex w-full flex-col gap-3 sm:w-auto sm:flex-row sm:items-center sm:gap-6">
        <a
          class="btn-brand inline-flex min-h-12 items-center justify-center gap-2 rounded-lg px-6 py-3 font-body-md text-body-md font-semibold"
          [href]="i18n.copy().whatsapp.href"
          target="_blank"
          rel="noopener noreferrer"
        >
          <app-whatsapp-icon [size]="22" />
          <span>{{ i18n.copy().hero.ctaPrimary }}</span>
        </a>
        <a
          class="inline-flex min-h-12 items-center justify-center gap-1 self-center px-2 sm:self-auto font-body-md text-body-md font-semibold text-on-surface link-quiet"
          routerLink="/"
          fragment="proyectos"
        >
          {{ i18n.copy().hero.ctaSecondary }}
          <span class="material-symbols-outlined text-[18px]" aria-hidden="true">arrow_downward</span>
        </a>
      </div>

      <ul
        class="hidden flex-col gap-1 font-body-sm text-body-sm text-on-surface-variant sm:flex sm:gap-1.5"
      >
        @for (item of i18n.copy().hero.trust; track item) {
          <li class="flex items-center gap-2">
            <span class="h-1 w-1 rounded-full bg-accent" aria-hidden="true"></span>
            {{ item }}
          </li>
        }
      </ul>
    </div>

    <figure class="m-0 w-full" [attr.aria-label]="i18n.copy().hero.chat.demo.label">
      <div
        class="flex flex-col items-stretch gap-3 sm:flex-row sm:items-center sm:gap-0"
        aria-hidden="true"
      >
        <div
          class="w-full overflow-hidden rounded-2xl border border-outline-variant bg-surface-container-low sm:w-[300px] sm:shrink-0"
        >
          <div class="flex items-center gap-3 border-b border-outline-variant px-4 py-3">
            <span
              class="flex h-9 w-9 items-center justify-center rounded-full bg-[#25d366] text-[#0b0b0d]"
            >
              <app-whatsapp-icon [size]="20" />
            </span>
            <span class="flex flex-col leading-tight">
              <span class="font-body-md text-body-md font-semibold text-primary">
                {{ i18n.copy().hero.chat.name }}
              </span>
              <span class="font-body-sm text-body-sm text-on-surface-variant">
                {{ i18n.copy().hero.chat.demo.channel }} · {{ i18n.copy().hero.chat.status }}
              </span>
            </span>
          </div>
          <div class="flex h-[320px] flex-col justify-end gap-2 overflow-hidden p-4">
            @for (message of visibleMessages(); track $index) {
              <p
                class="max-w-[88%] rounded-2xl px-3.5 py-2 font-body-md text-[14px] leading-5 motion-safe:animate-pop"
                [class]="
                  message.from === 'client'
                    ? 'self-start rounded-tl-sm bg-surface-container-high text-on-surface'
                    : 'btn-brand self-end rounded-tr-sm'
                "
              >
                {{ message.text }}
              </p>
            }
            @if (typing()) {
              <span
                class="flex gap-1 self-end rounded-2xl rounded-tr-sm bg-surface-container-high px-4 py-3"
              >
                @for (dot of [0, 1, 2]; track dot) {
                  <span
                    class="h-1.5 w-1.5 rounded-full bg-on-surface-variant motion-safe:animate-bounce"
                    [style.animation-delay.ms]="dot * 150"
                  ></span>
                }
              </span>
            }
          </div>
        </div>

        <div class="flex flex-col items-center gap-1 text-center text-accent sm:w-24 sm:shrink-0">
          <span class="sm:hidden"><span class="material-symbols-outlined rotate-90 text-[22px]">sync_alt</span></span>
          <svg class="hidden h-3 w-full sm:block" viewBox="0 0 80 12" fill="none">
            <line
              x1="0"
              y1="6"
              x2="80"
              y2="6"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-dasharray="4 4"
              [class.motion-safe:animate-flow]="!finished()"
            />
          </svg>
          <span class="font-body-sm text-[12px] leading-4 font-semibold text-on-surface-variant">
            {{ i18n.copy().hero.chat.demo.assistant }}
          </span>
        </div>

        <div
          class="w-full rounded-2xl border border-outline-variant bg-surface-container-low p-4 sm:w-[240px] sm:shrink-0"
        >
          <p
            class="mb-4 flex items-center gap-2 font-body-md text-body-md font-semibold text-primary"
          >
            <span class="material-symbols-outlined text-[20px] text-accent">point_of_sale</span>
            {{ i18n.copy().hero.chat.demo.system }}
          </p>
          <p class="mb-1 font-body-sm text-body-sm text-on-surface-variant">
            {{ i18n.copy().hero.chat.demo.item }}
          </p>
          <p class="mb-4 flex items-baseline gap-2">
            <span
              class="font-display text-[2.5rem] leading-none font-semibold text-primary tabular-nums"
            >
              {{ stock() }}
            </span>
            <span class="font-body-sm text-body-sm text-on-surface-variant">
              {{ i18n.copy().hero.chat.demo.unit }} · {{ i18n.copy().hero.chat.demo.stock }}
            </span>
          </p>
          <div class="min-h-[3.25rem]">
            @if (finished()) {
              <div class="border-t border-outline-variant pt-3 motion-safe:animate-pop">
                <p
                  class="flex items-center gap-1.5 font-body-sm text-body-sm font-semibold text-primary"
                >
                  <span class="material-symbols-outlined text-[16px] text-group-manage"
                    >check_circle</span
                  >
                  {{ i18n.copy().hero.chat.demo.held }}
                </p>
                <p class="font-body-sm text-[12px] leading-4 text-on-surface-variant">
                  {{ i18n.copy().hero.chat.notificationBody }}
                </p>
              </div>
            }
          </div>
        </div>
      </div>
      <figcaption class="mt-4 font-body-sm text-body-sm text-outline">
        {{ i18n.copy().hero.chat.demo.label }}
      </figcaption>
    </figure>
  </div>
</section>
