@let copy = i18n.copy().projects;
<section id="proyectos" class="w-full border-t border-outline-variant py-16 lg:py-20">
  <div class="mx-auto max-w-[1440px] px-margin-mobile md:px-margin-tablet lg:px-margin">
    <div class="mb-10 flex flex-col gap-3 lg:mb-12 lg:flex-row lg:items-end lg:justify-between lg:gap-12">
      <div>
        <p class="mb-3 font-body-md text-body-md font-semibold text-accent">{{ copy.eyebrow }}</p>
        <h2 class="font-display text-[1.75rem] leading-tight font-semibold tracking-tight text-primary lg:text-[2.25rem]">
          {{ copy.title }}
        </h2>
      </div>
      <p class="max-w-[30rem] font-body-md text-body-md text-on-surface-variant">{{ copy.note }}</p>
    </div>

    <ul class="flex flex-wrap items-center gap-4 sm:gap-6">
      @for (client of clients; track client.href) {
        <li>
          <a
            class="group flex h-24 w-44 items-center justify-center rounded-2xl border border-outline-variant bg-white p-4 transition duration-300 hover:-translate-y-0.5 hover:border-accent sm:h-28 sm:w-52"
            [href]="client.href"
            target="_blank"
            rel="noopener noreferrer"
            [title]="client.name"
          >
            <img
              class="max-h-full w-auto object-contain"
              [src]="client.logo"
              [alt]="client.name"
              loading="lazy"
            />
          </a>
        </li>
      }
    </ul>
  </div>
</section>
